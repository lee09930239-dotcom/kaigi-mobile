<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>会議字幕 モバイル</title>
<script>
// テスト版は正式版に統合しました。会議と設定は正式版を開いたときに自動で移ります。
try{navigator.serviceWorker&&navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>{if(/\/dev\/$/.test(r.scope))r.unregister()}))}catch(e){}
location.replace('../'+location.search+location.hash);
</script></head>
<body style="font:16px sans-serif;padding:20px"><p>新しいページに移動しています… <a href="../">開かない場合はこちら</a></p></body></html>
